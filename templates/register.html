<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><main class="container py-4" style="max-width:850px"><a href="{{ url_for('index') }}" class="text-danger">← Home</a><div class="card p-4 mt-3"><h1>Create your account</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Full name<input class="form-control" name="name" required></label></div><div class="col-md-6"><label class="form-label">Email<input class="form-control" type="email" name="email" required></label></div><div class="col-md-6"><label class="form-label">Phone<input class="form-control" name="phone" required></label></div><div class="col-md-6"><label class="form-label">Password<input class="form-control" type="password" name="password" minlength="8" required></label></div><div class="col-md-4"><label class="form-label">Blood group<select class="form-select" name="blood_group" required>{% for group in blood_groups %}<option>{{ group }}</option>{% endfor %}</select></label></div><div class="col-md-4"><label class="form-label">Date of birth<input class="form-control" type="date" name="dob" required></label></div><div class="col-md-4"><label class="form-label">Gender<select class="form-select" name="gender"><option>Female</option><option>Male</option><option>Other</option></select></label></div><div class="col-12"><label class="form-label">Address<textarea class="form-control" name="address" required></textarea></label></div><div class="col-12"><button class="btn btn-primary">Register</button> <a class="btn btn-outline-secondary" href="{{ url_for('login') }}">Already registered?</a></div></form></div></main></body></html>
