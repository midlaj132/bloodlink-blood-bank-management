<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><main class="container py-5" style="max-width:560px"><a href="{{ url_for('index') }}" class="text-danger">← Home</a><div class="card p-4 mt-4"><h1>Welcome back</h1><p class="small-muted">Sign in to manage blood care records.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label class="form-label">Email<input class="form-control mb-3" type="email" name="email" required></label><label class="form-label">Password<input class="form-control mb-3" type="password" name="password" required></label><button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></main></body></html>
