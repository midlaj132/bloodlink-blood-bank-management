<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donor form</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><main class="container py-4" style="max-width:850px"><a href="{{ url_for('dashboard') }}" class="text-danger">← Dashboard</a><div class="card p-4 mt-3"><h1>{{ 'Edit donor' if donor else 'Register as a donor' }}</h1><form method="post" class="row g-3">{% for label,name,type in [('Full name','name','text'),('Email','email','email'),('Phone','phone','text'),('Date of birth','dob','date'),('Last donation date','last_donation','date')] %}<div class="col-md-6"><label class="form-label">{{ label }}<input class="form-control" type="{{ type }}" name="{{ name }}" value="{{ donor[name] if donor else '' }}" {% if name != 'last_donation' %}required{% endif %}></label></div>{% endfor %}<div class="col-md-6"><label class="form-label">Blood group<select class="form-select" name="blood_group">{% for group in blood_groups %}<option {% if donor and donor.blood_group == group %}selected{% endif %}>{{ group }}</option>{% endfor %}</select></label></div><div class="col-md-6"><label class="form-label">Gender<select class="form-select" name="gender"><option>Female</option><option>Male</option><option>Other</option></select></label></div><div class="col-md-6"><label class="form-label">Eligibility<select class="form-select" name="eligibility"><option>Eligible</option><option>Pending review</option><option>Not eligible</option></select></label></div><div class="col-12"><label class="form-label">Address<textarea class="form-control" name="address" required>{{ donor.address if donor else '' }}</textarea></label></div><div class="col-12"><button class="btn btn-primary">Save donor</button></div></form></div></main></body></html>
