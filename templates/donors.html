<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donors</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><main class="container py-4"><a href="{{ url_for('dashboard') }}" class="text-danger">← Dashboard</a><div class="d-flex justify-content-between align-items-center my-3"><h1>Donors</h1><a class="btn btn-primary" href="{{ url_for('donor_add') }}">Add donor</a></div><form class="row g-2 mb-3"><div class="col-md-5"><input class="form-control" name="q" placeholder="Search name, email, phone" value="{{ request.args.get('q','') }}"></div><div class="col-md-3"><select class="form-select" name="blood_group"><option value="">All groups</option>{% for group in blood_groups %}<option {% if request.args.get('blood_group') == group %}selected{% endif %}>{{ group }}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-outline-secondary">Filter</button></div></form><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Group</th><th>Phone</th><th>Eligibility</th><th></th></tr></thead><tbody>{% for donor in donors %}<tr><td>{{ donor.name }}<br><small>{{ donor.email }}</small></td><td><span class="blood-chip">{{ donor.blood_group }}</span></td><td>{{ donor.phone }}</td><td>{{ donor.eligibility }}</td><td><a href="{{ url_for('donor_edit',donor_id=donor.id) }}" class="btn btn-sm btn-outline-secondary">Edit</a><form class="d-inline" method="post" action="{{ url_for('donor_delete',donor_id=donor.id) }}"><button class="btn btn-sm btn-outline-danger" data-confirm="Delete this donor?">Delete</button></form></td></tr>{% else %}<tr><td colspan="5">No donors match your filters.</td></tr>{% endfor %}</tbody></table></div></main><script src="{{ url_for('static',filename='js/script.js') }}"></script></body></html>
