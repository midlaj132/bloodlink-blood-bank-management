<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blood request</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><main class="container py-4" style="max-width:900px"><a href="{{ url_for('dashboard') }}" class="text-danger">← Dashboard</a><div class="card p-4 mt-3"><h1>Request blood</h1><p class="small-muted">Educational software only. Qualified medical professionals must make real transfusion decisions.</p><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Patient name<input class="form-control" name="patient_name" required></label></div><div class="col-md-3"><label class="form-label">Patient age<input class="form-control" type="number" min="1" name="patient_age" required></label></div><div class="col-md-3"><label class="form-label">Gender<select class="form-select" name="gender"><option>Female</option><option>Male</option><option>Other</option></select></label></div><div class="col-md-4"><label class="form-label">Blood group required<select class="form-select" id="blood_group" name="blood_group">{% for group in blood_groups %}<option>{{ group }}</option>{% endfor %}</select></label></div><div class="col-md-4"><label class="form-label">Units required<input class="form-control" type="number" min="1" name="units_required" required></label></div><div class="col-md-4"><label class="form-label">Urgency<select class="form-select" name="urgency"><option>Normal</option><option>Urgent</option><option>Emergency</option></select></label></div><div class="col-12"><div class="alert alert-light">Compatible donor groups: <strong id="compatible-groups" data-map='{{ compatibility|tojson }}'></strong></div></div><div class="col-md-6"><label class="form-label">Hospital name<input class="form-control" name="hospital_name" required></label></div><div class="col-md-6"><label class="form-label">Hospital contact<input class="form-control" name="hospital_contact" required></label></div><div class="col-12"><label class="form-label">Reason<textarea class="form-control" name="reason" required></textarea></label></div><div class="col-12"><button class="btn btn-primary">Submit request</button></div></form></div></main><script src="{{ url_for('static',filename='js/script.js') }}"></script></body></html>
