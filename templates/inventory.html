<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventory</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><main class="container py-4"><a href="{{ url_for('dashboard') }}" class="text-danger">← Dashboard</a><h1 class="my-3">Blood inventory</h1><div class="row g-3">{% for item in inventory %}<div class="col-sm-6 col-lg-3"><div class="card p-3"><div class="d-flex justify-content-between"><strong>{{ item.blood_group }}</strong><span class="stat">{{ item.units }}</span></div><div class="progress my-2"><div class="progress-bar bg-danger" style="width:{{ [item.units * 5,100]|min }}%"></div></div><small class="small-muted">Updated {{ item.updated_at }}</small>{% if g.user.role == 'admin' %}<form method="post" action="{{ url_for('inventory_update',item_id=item.id) }}" class="mt-2"><input class="form-control form-control-sm" type="number" min="0" name="units" value="{{ item.units }}"><button class="btn btn-sm btn-primary mt-2">Update</button></form>{% endif %}</div></div>{% endfor %}</div>{% if g.user.role == 'admin' %}<div class="card p-4 mt-4"><h2 class="h5">Add or replace stock</h2><form method="post" action="{{ url_for('inventory_add') }}" class="row g-2"><div class="col-md-4"><select class="form-select" name="blood_group">{% for group in blood_groups %}<option>{{ group }}</option>{% endfor %}</select></div><div class="col-md-4"><input class="form-control" type="number" min="0" name="units" placeholder="Units" required></div><div class="col-md-4"><button class="btn btn-primary">Save stock</button></div></form></div>{% endif %}</main></body></html>
